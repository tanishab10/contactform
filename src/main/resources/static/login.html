<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maincrafts | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f7ff;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(50, 50, 100, 0.1);
        }

        h1 {
            text-align: center;
            color: #5b5bea;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #5b5bea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4545c9;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Maincrafts</h1>
        <p>Admin Login</p>

        <div id="message" class="message"></div>

        <form action="/login" method="post">

            <label for="username">Username</label>
            <input type="text" id="username"
                   name="username"
                   placeholder="Enter username"
                   required>

            <label for="password">Password</label>
            <input type="password" id="password"
                   name="password"
                   placeholder="Enter password"
                   required>

            <button type="submit">Login</button>

        </form>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");

        if (params.has("error")) {
            message.textContent = "Invalid username or password!";
            message.classList.add("error");
        }

        if (params.has("logout")) {
            message.textContent = "You have logged out successfully!";
            message.classList.add("success");
        }
    </script>

</body>
</html>
