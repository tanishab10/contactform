
<!DOCTYPE html>
<html>
<head>
    <title>Contact Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h2>All Contacts</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Message</th>
            </tr>
        </thead>

        <tbody id="contactTable">
        </tbody>
    </table>

    <script>
        fetch("http://localhost:8080/contacts")
        .then(response => response.json())
        .then(data => {

            let table = document.getElementById("contactTable");

            data.forEach(c => {

                let row = document.createElement("tr");

                [c.id, c.name, c.email, c.message].forEach(value => {
                    let cell = document.createElement("td");
                    cell.textContent = value ?? "";
                    row.appendChild(cell);
                });

                table.appendChild(row);
            });

        })
        .catch(error => {
            console.log("Error:", error);
        });
    </script>

</body>
</html>
