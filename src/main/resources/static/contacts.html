<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maincrafts | Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f7ff;
            padding: 40px;
            color: #20204a;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        h1 {
            color: #5b5bea;
        }

        .logout-btn {
            padding: 12px 22px;
            background: #5b5bea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #4545c9;
        }

        .dashboard {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(50, 50, 100, 0.08);
        }

        h2 {
            margin-bottom: 25px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #5b5bea;
            color: white;
        }

        tr:nth-child(even) {
            background: #f7f7ff;
        }

        #status {
            margin-bottom: 15px;
            color: #666;
        }

        @media(max-width: 600px) {
            body {
                padding: 15px;
            }

            .header {
                gap: 15px;
                flex-wrap: wrap;
            }

            .dashboard {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <h1>Maincrafts Admin</h1>

        <form action="/logout" method="post">
            <button type="submit" class="logout-btn">
                Logout
            </button>
        </form>

    </div>

    <div class="dashboard">

        <h2>All Submitted Contacts</h2>

        <p id="status">Loading contacts...</p>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Message</th>
                    </tr>
                </thead>

                <tbody id="contactTable">
                </tbody>

            </table>

        </div>

    </div>

    <script>

        fetch("/contacts")

        .then(response => {

            if (!response.ok) {
                throw new Error("Unable to fetch contacts");
            }

            return response.json();

        })

        .then(data => {

            const table = document.getElementById("contactTable");
            const status = document.getElementById("status");

            table.innerHTML = "";

            if (data.length === 0) {
                status.textContent = "No contacts found.";
                return;
            }

            data.forEach(c => {

                const row = document.createElement("tr");

                [c.id, c.name, c.email, c.message].forEach(value => {

                    const cell = document.createElement("td");

                    cell.textContent = value ?? "";

                    row.appendChild(cell);

                });

                table.appendChild(row);

            });

            status.textContent = "Total contacts: " + data.length;

        })

        .catch(error => {

            document.getElementById("status").textContent =
                "Error loading contacts. Please try again.";

            console.error(error);

        });

    </script>

</body>
</html>
